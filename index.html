<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>GamesCrafter Store | Free Online HTML5 Cyber Games Portal</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="GamesCrafter Store | Free Online HTML5 Cyber Games Portal" />
    <meta name="description" content="Play 30+ instant 1-player & 2-player browser games on GamesCrafter Store. No download needed. Cyberpunk arcade, racing, puzzles, space shooters & retro action." />

    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://gamescrafter.store/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gamescrafter.store/" />
    <meta property="og:title" content="GamesCrafter Store | Free Cyber Games Portal" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="GamesCrafter Store | Free Cyber Games Portal" />
    <meta property="twitter:description" content="Instant play 30+ HTML5 games online. No install needed!" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GamesCrafter Store",
        "url": "https://gamescrafter.store/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://gamescrafter.store/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "description": "Premium online gaming portal featuring 30+ instant HTML5 browser games for single and 2-player modes."
      }
    </script>

  <body class="bg-[#0f172a] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black min-h-screen">
